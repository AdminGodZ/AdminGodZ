name: Update README stats

on:
  # Refresh the stats daily at 01:00 UTC
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STATS_TOKEN is a personal access token with `repo` scope so private repos are counted
      - name: Regenerate stats
        run: python .github/scripts/update_stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update README stats [skip ci]"
          git push
