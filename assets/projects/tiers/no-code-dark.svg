<svg xmlns="http://www.w3.org/2000/svg" width="892" height="46" viewBox="0 0 892 46" role="img" aria-label="No code yet: 3 projects"><title>No code yet: 3 projects</title>
<style>
.in{animation:fade-up .8s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}

.draw{animation:draw 2s cubic-bezier(.4,0,.2,1) .4s backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.late{animation:fade 1s 1.6s backwards}
@keyframes fade{from{opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) .15s backwards}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}}
.glint{animation:glint 3.5s ease-in-out 1.2s infinite}
@keyframes glint{0%{transform:translateX(0)}35%,100%{transform:translateX(40px)}}
.sparkle{transform-box:fill-box;transform-origin:center;animation:sparkle 2.4s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#8b949e" stop-opacity=".6"/><stop offset="1" stop-color="#8b949e" stop-opacity="0"/></linearGradient>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">

<text class="in" x="10" y="30" font-size="17" font-weight="600" fill="#8b949e">No code yet <tspan dx="4" font-size="13" font-weight="400" fill="#8b949e">3 projects</tspan></text>
<rect class="grow" style="animation-delay:0.30s" x="184" y="23" width="702" height="1" fill="url(#fade)"/>
</g></svg>
